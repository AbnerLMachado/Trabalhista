  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --accent-gold: #fbbf24;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f293d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 2rem 1rem 1rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title span {
      color: var(--accent-gold);
    }

    .subtitle-badge {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      width: fit-content;
    }

    /* Container Main */
    main.container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Filter Bar */
    .filter-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .filter-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .filter-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    /* Stats Bar */
    .quiz-stats-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .stat-hits { color: var(--accent-green); }
    .stat-errors { color: var(--accent-red); }
    .stat-pct { color: var(--accent-gold); }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      transition: width 0.3s ease;
    }

    /* Question Cards */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s;
    }

    .quiz-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .quiz-badge {
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .question-id {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: monospace;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1.25rem;
      white-space: pre-line;
      text-align: justify;
      line-height: 1.6;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.5;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--accent-blue);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--accent-green) !important;
      color: #fff;
      font-weight: 600;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--accent-red) !important;
      color: #fff;
    }

    .explanation-box {
      display: none;
      background: #0f172a;
      border: 1px solid var(--accent-blue);
      border-radius: 8px;
      padding: 1.1rem;
      margin-top: 1.25rem;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .reset-btn {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .reset-btn:hover {
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .brand-title { font-size: 1.4rem; }
      .quiz-stats-bar { flex-direction: column; align-items: flex-start; }
      .quiz-card { padding: 1.25rem; }
    }
  </style>

    <div id="questions-container">

  <script>
    const questionsData = [
      {
        id: "Q4402543",
        topic: "vinculo",
        banca: "COPEVE/UFAL - FUNDEPES 2026 - IFAL",
        text: `Uma empresa do ramo financeiro contratou outra empresa para lhe prestar serviços de telemarketing para a oferta de crédito e de outros produtos financeiros no mercado, mediante a utilização de trabalhadores desta última empresa, cujos serviços eram executados nas instalações físicas da empresa contratante. Um determinado empregado da empresa contratada passou a receber ordens diretas de um dos gerentes da empresa contratante que, inclusive, passou a lhe exigir serviços de assessoramento e de secretaria ao referido gestor, a exemplo de controle de agenda pessoal, elaboração e análise de planilhas e documentos, além de pagamentos bancários e outros serviços externos relacionados à gerência da empresa contratante. Chegado ao término do contrato de prestação de serviços entre as empresas, o determinado empregado teve seu contrato de trabalho rescindido sem justa causa, ocasião em que restaram inadimplidas as verbas rescisórias e se verificou a ausência de recolhimento do Fundo de Garantia do Tempo de Serviço e das contribuições previdenciárias. Dadas as afirmativas acerca do caso hipotético,

I. O fato de a empresa tomadora dos serviços contratar trabalhadores terceirizados para uma de suas atividades principais no âmbito de suas dependências, por si só, configuraria a relação de emprego entre a contratante e os empregados da contratada.
II. O empregado ao trabalhar pessoalmente, de forma habitual e onerosa, sob as ordens diretas do gerente da empresa contratante, em atividades distintas daquelas que foram objeto do contrato com a empresa prestadora de serviços, poderia ter o vínculo de emprego reconhecido diretamente com a empresa tomadora dos serviços, não obstante a relação de terceirização.
III. Na hipótese, caberia à empresa contratada garantir as condições de segurança, de higiene e de salubridade dos trabalhadores vinculados ao contrato de terceirização com a empresa contratante.
IV. A empresa contratante é subsidiariamente responsável pelas obrigações trabalhistas referentes aos períodos em que ocorrer a prestação de serviços, incumbindo-lhe a retenção do percentual devido a título de contribuição previdenciária em nome da empresa contratada, em decorrência da prestação dos serviços contratados em seu favor.

verifica-se que está/ão correta/s apenas`,
        options: [
          "IV.",
          "I e III.",
          "II e IV.",
          "I, II e III.",
          "II, III e IV."
        ],
        correct: 2,
        exp: "Fundamentação: A afirmativa II está correta porque a presença de subordinação direta e pessoalidade em favor da tomadora descaracteriza a terceirização legítima e atrai o vínculo empregatício direto (Princípio da Primazia da Realidade / Art. 9º da CLT). A afirmativa IV está correta pois a tomadora responde subsidiariamente pelos débitos trabalhistas (Art. 5º-A, § 5º da Lei 6.019/74 e Súmula 331 do TST). A afirmativa I é incorreta conforme decisão do STF (ADPF 324 / RE 958.252) que admite terceirização em atividade-fim. A afirmativa III é falsa pois a garantia de salubridade e segurança nas instalações físicas incumbe à tomadora (Art. 5º-A, § 3º da Lei 6.019/74)."
      },
      {
        id: "Q4527022",
        topic: "contrato",
        banca: "Instituto Avança São Paulo 2026 - Pref. Taiúva",
        text: "Sobre os requisitos e características do contrato individual de trabalho, assinale a opção correta:",
        options: [
          "O contrato de trabalho é sinalagmático apenas quando analisadas prestações individualmente consideradas, podendo haver, em cada uma delas, ausência de reciprocidade obrigacional.",
          "A natureza de trato sucessivo do contrato de trabalho decorre da continuidade das obrigações no tempo, não se exaurindo em uma única prestação.",
          "O poder diretivo do empregador é incompatível com a natureza bilateral do contrato de trabalho, pois rompe a equivalência das obrigações assumidas pelas partes.",
          "A prestação de serviços gratuitos por longo período não afasta a existência do contrato de trabalho, desde que presentes os elementos fático-jurídicos da relação de emprego.",
          "O contrato de trabalho é necessariamente solene, exigindo forma escrita e registro prévio como condição de validade, sob pena de nulidade absoluta."
        ],
        correct: 1,
        exp: "Fundamentação: O contrato individual de trabalho é um negócio jurídico de trato sucessivo (ou de débito contínuo), pois suas obrigações se renovam continuamente no tempo (trabalho vs. salário), não se exaurindo em um único ato de execução."
      },
      {
        id: "Q4296814",
        topic: "contrato",
        banca: "Instituto Avança São Paulo 2026 - Pref. Americana",
        text: "Em conformidade com a Consolidação das Leis do Trabalho (CLT) e normas correlatas aplicáveis ao processo de admissão de empregados, assinale a alternativa que corretamente apresenta uma obrigação do empregador no momento da admissão:",
        options: [
          "Realizar o registro do empregado no eSocial, contendo data de admissão, remuneração e função, antes do início das atividades laborais.",
          "Solicitar ao empregado exame de gravidez como condição para contratação, desde que ele seja mantido em sigilo.",
          "Exigir experiência prévia mínima de seis meses para qualquer função, conforme determinação do Ministério do Trabalho.",
          "Condicionar a contratação ao fornecimento do histórico de crédito do candidato, quando a atividade envolver valores financeiros.",
          "Solicitar que o empregado assine termo renunciando ao direito de férias proporcionais, desde que registrado em contrato."
        ],
        correct: 0,
        exp: "Fundamentação: O registro do empregado deve ser efetuado no eSocial até o dia imediatamente anterior ao do início da prestação dos serviços (Art. 29 e Art. 41 da CLT). Exame de gravidez é vedado pela Lei 9.029/95; a exigência de experiência prévia não pode EXCEDER 6 meses (Art. 442-A da CLT); e a renúncia a férias viola o princípio da irrenunciabilidade."
      },
      {
        id: "Q4257500",

        text: "Sobre o conceito de empregador conforme disposto na Consolidação das Leis do Trabalho (CLT), assinale a alternativa correta:",

        exp: "Fundamentação: Redação exata do Art. 2º, caput, da CLT: 'Considera-se empregador a empresa, individual ou coletiva, que, assumindo os riscos da atividade econômica, admite, assalaria e dirige a prestação pessoal de serviço.'"
      },
      {
        id: "Q4318977",
        topic: "contrato",
        banca: "IBADE 2026 - CREF 19",
        text: `Sobre o contrato individual de trabalho, analise as afirmativas.

I. A alteração contratual exige mútuo consentimento e preservação do equilíbrio, admitindo variações próprias do jus variandi dentro dos limites legais e do conteúdo ocupacional.
II. A suspensão contratual costuma afastar a prestação de trabalho e o pagamento de salário, com repercussões na contagem de tempo de serviço conforme previsão legal.

V. O empregado hipersuficiente pode pactuar cláusulas com força semelhante à negociação coletiva em matérias autorizadas, observados requisitos de escolaridade e remuneração previstos em lei.

Estão corretas as afirmativas:`,
        options: [
          "I, II e III, apenas.",
          "I, II, III e IV, apenas.",
          "II, III e V, apenas.",
          "II, III e IV, apenas.",
          "I, II, III, IV e V."
        ],
        correct: 4,
        exp: "Fundamentação: Todas as assertivas são corretas. I reflete o Art. 468 da CLT; II expressa a definição de suspensão do contrato; III traz a essência do Princípio da Continuidade (Súmula 212 TST); IV reflete o Art. 452-A da CLT; e V expressa a figura do empregado hipersuficiente do Art. 444, parágrafo único, da CLT."
      },
      {
        id: "Q4365054",
        topic: "principios",
        banca: "VUNESP 2026 - Câm. Caraguatatuba",
        text: "No Direito do Trabalho a regra que, com o intuito de proteger o trabalhador, considerado a parte hipossuficiente da relação empregatícia, impede que novas situações laborais, ainda que previstas em lei ou em negociação coletiva, prevaleçam sobre aquelas mais vantajosas já incorporadas ao contrato individual de trabalho do empregado expressa o princípio trabalhista",
        options: [
          "do in dubio pro operario.",
          "da Primazia da Realidade.",
          "da Continuidade da Relação de Emprego.",
          "da Condição Mais Benéfica.",
          "da Irrenunciabilidade de Direitos."
        ],
        correct: 3,
        exp: "Fundamentação: O Princípio da Condição Mais Benéfica estabelece que as vantagens concedidas ao longo do contrato incorporam-se ao patrimônio jurídico do empregado e não podem ser suprimidas por normas posteriores menos favoráveis (Súmula 51 do TST e Art. 468 da CLT)."
      },
      {
        id: "Q4662873",

        banca: "Objetiva Concursos 2026 - Pref. Canoas",
        text: "No que concerne às normas regentes da prestação de serviços fora das dependências do empregador, assinalar a alternativa CORRETA.",
        options: [

          "A prestação de serviços por produção em regime de teletrabalho submete-se integralmente às normas ordinárias de duração do trabalho."
        ],
        correct: 0,
        exp: "Fundamentação: Conforme o Art. 75-B, § 1º, da CLT: 'O comparecimento às dependências do empregador para a realização de atividades específicas, ainda que de modo habitual, não descaracteriza o regime de teletrabalho ou trabalho remoto.'"
      },
      {
        id: "Q4646480",
        topic: "sujeitos",
        banca: "FUNDATEC 2026 - CRA RS",
        text: "Assinale a alternativa que indica corretamente uma situação em que se considera tempo do empregado à disposição do empregador.",
        options: [
          "Atividade de alimentação.",

        exp: "Fundamentação: Art. 4º, § 2º, VIII, da CLT: A troca de roupa ou uniforme apenas será considerada tempo à disposição do empregador quando houver a obrigatoriedade de realizar a troca na própria empresa."
      },
      {
        id: "Q4416290",
        topic: "contrato",
        banca: "SELECON 2026 - EMGEPRON",
        text: "O empregador, em relação aos trabalhadores que admitir, terá o seguinte prazo, em dias úteis, para anotar a data de admissão, a remuneração e as condições especiais, se houver, facultada a adoção de sistema manual, mecânico ou eletrônico, conforme instruções a serem expedidas pelo Ministério da Economia:",
        options: [

        ],

      },
      {
        id: "Q4433834",

        banca: "Fronte Concursos 2026 - Câm. Altinópolis",
        text: "Pedro presta serviços a uma empresa mediante subordinação e recebimento de salário. Segundo a literalidade da CLT, para que Pedro seja considerado legalmente \"empregado\", os serviços por ele prestados devem ser de natureza:",
        options: [

    let userAnswers = {};
    let currentFilter = 'all';

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      const filtered = questionsData.filter(q => currentFilter === 'all' || q.topic === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 3rem;">Nenhuma questão encontrada para este tópico.</div>`;
        return;
      }

      filtered.forEach((q) => {
        const globalIndex = questionsData.findIndex(item => item.id === q.id);
        const qCard = document.createElement('div');
        qCard.className = 'quiz-card';
        qCard.id = `quiz-q-${globalIndex}`;

        let optionsHTML = '';
        const labels = ['A', 'B', 'C', 'D', 'E'];
        q.options.forEach((opt, optIdx) => {
          optionsHTML += `
            <button class="option-btn" id="opt-${globalIndex}-${optIdx}" onclick="selectOption(${globalIndex}, ${optIdx})">
              <strong>${labels[optIdx]})</strong> ${opt}
            </button>
          `;
        });

        qCard.innerHTML = `
          <div class="quiz-header">
            <span class="quiz-badge">${q.banca}</span>
            <span class="question-id">Questão ${globalIndex + 1} de ${questionsData.length} • [${q.id}]</span>
          </div>
          <div class="question-text">${q.text}</div>
          <div class="quiz-options">
            ${optionsHTML}
          </div>
          <div class="explanation-box" id="exp-${globalIndex}">
            <strong style="color: var(--accent-gold); display: block; margin-bottom: 0.4rem;">
              <i class="fa-solid fa-scale-balanced"></i> Gabarito Comentado:
            </strong>
            <p style="color: #e2e8f0;">${q.exp}</p>
          </div>
        `;

        container.appendChild(qCard);

        if (userAnswers[globalIndex] !== undefined) {
          const ans = userAnswers[globalIndex];
          q.options.forEach((_, optIdx) => {
            const btn = document.getElementById(`opt-${globalIndex}-${optIdx}`);
            if (btn) {
              btn.disabled = true;
              if (optIdx === q.correct) btn.classList.add('correct');
              else if (optIdx === ans.selected) btn.classList.add('wrong');
            }
          });
          const expBox = document.getElementById(`exp-${globalIndex}`);
          if (expBox) expBox.style.display = 'block';
        }
      });
    }

    function selectOption(qIdx, selectedOptIdx) {
      if (userAnswers[qIdx] !== undefined) return;

      const q = questionsData[qIdx];
      const isCorrect = (selectedOptIdx === q.correct);
      userAnswers[qIdx] = { selected: selectedOptIdx, correct: isCorrect };

      q.options.forEach((_, optIdx) => {
        const btn = document.getElementById(`opt-${qIdx}-${optIdx}`);
        if (btn) {
          btn.disabled = true;
          if (optIdx === q.correct) {
            btn.classList.add('correct');
          } else if (optIdx === selectedOptIdx) {
            btn.classList.add('wrong');
          }
        }
      });

      const expBox = document.getElementById(`exp-${qIdx}`);
      if (expBox) expBox.style.display = 'block';

      updateStats();
    }

    function updateStats() {
      const answeredKeys = Object.keys(userAnswers);
      const totalAnswered = answeredKeys.length;
      let hits = 0;
      let errors = 0;

      answeredKeys.forEach(k => {
        if (userAnswers[k].correct) hits++;
        else errors++;
      });

      document.getElementById('stat-hits-num').innerText = hits;
      document.getElementById('stat-errors-num').innerText = errors;
      
      const pct = totalAnswered > 0 ? Math.round((hits / totalAnswered) * 100) : 0;
      document.getElementById('stat-pct-num').innerText = pct + '%';

      const progressPct = Math.round((totalAnswered / questionsData.length) * 100);
      document.getElementById('quiz-progress-bar').style.width = progressPct + '%';
    }

    function resetQuiz() {
      userAnswers = {};
      document.getElementById('stat-hits-num').innerText = '0';
      document.getElementById('stat-errors-num').innerText = '0';
      document.getElementById('stat-pct-num').innerText = '0%';
      document.getElementById('quiz-progress-bar').style.width = '0%';
      renderQuestions();
    }

    function filterTopic(topic) {
      currentFilter = topic;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderQuestions();
    }

    window.onload = function() {
      renderQuestions();
    };
  </script>
